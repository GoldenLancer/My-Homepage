name: Temp inspect publications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final publication source files
        shell: bash
        run: |
          set -euo pipefail
          for f in _publications/*.md; do
            echo "===== PUBLICATION: $f ====="
            cat "$f"
            echo
            echo "===== END PUBLICATION: $f ====="
          done
      - name: Delete temporary inspection branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/temp/inspect-publications" || true
